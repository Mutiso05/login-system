<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <script>
        function validateForm() {
            let user = document.forms["regForm"]["username"].value;
            let pass = document.forms["regForm"]["password"].value;
            if (user === "" || pass === "") {
                alert("Both fields are required!");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <h2>Register</h2>
    <form name="regForm" action="reg.php" method="post" onsubmit="return validateForm();">
        <label>Email:</label><br>
        <input type="email" name="username" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
